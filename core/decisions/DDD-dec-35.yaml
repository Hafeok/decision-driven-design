statement: |
  The upstream pin advances v5.12.0 -> v5.13.0, discharging the ground-migration execution's own prediction: exactly two pinned digests move, DDD-measure-01 and DDD-measure-16, both from the W1 rename in their statements, with every id and every hash the one the migration session wrote down before its edits were made.
