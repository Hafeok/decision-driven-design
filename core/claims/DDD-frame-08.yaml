format: 1
id: DDD-frame-08
kind: normative
statement: |
  Accountability is a relation (attribution, persistent principal, authority linkage, stake, sanction path), not an intrinsic capacity; an arrangement naming an executor but no principal is incomplete.
status: projected
region: consequential deployments
test: >-
  stakeholder and case studies — completeness of the relation predicting trust and remediation
  outcomes better than executor identity
owner: paper-4
changed: v4.5
notes: |
  Conceptual core verified against canon: core/05 (v4.5, P1) states "Accountability completeness is a property of an arrangement, not a capacity of an actor... linked to a persistent responsible principal, an attributable record, a defined stake, and an enforceable consequence path", and core/01/core/05 §1 "a judgment allocation naming no accountable party is... Escaped with an executor attached". Kept projected: the normative prediction (relation-completeness predicting trust/remediation) is unexercised, needing the stated case studies.
