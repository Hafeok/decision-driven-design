notes: |
  Verified against canon: core/07 §2 states the trust form directly — "confidence in an output need not depend on attributing intelligence to its producer" — and §§2-3 supply the "and nothing more" scoping (closure does not price generation, per the v4.5 generation-cost correction and core/09 §7; accountability is separate, core/05). Kept projected: core/07 carries it as a derivation, unexercised, and it is named a candidate for formalisation. Verified as stated, not restatused.
