id: DDD-measure-10
kind: formal
statement: >
  You cannot decompose your way out of the work: for a fixed closing task, H(V|S) = 0
  requires I(V;S) = H(V) — the parts become trivial only when the decomposition already
  encodes the entire verdict. Demand is conserved, not escapable by re-decomposition.
status: established
region: closing predicates only, conditional on DDD-measure-01
credits: The theorem is Shannon's (chain rule, 1948); only the identification is ours.
