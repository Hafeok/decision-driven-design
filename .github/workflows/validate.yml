name: validate

on:
  push:
    paths:
      - 'core/**'
      - 'graph/**'
      - 'apparatus/**'
      - 'applications/**'
  pull_request:
    paths:
      - 'core/**'
      - 'graph/**'
      - 'apparatus/**'
      - 'applications/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Local claims + decisions schema
        run: |
          python3 scripts/validate-claims.py core/claims/
          python3 scripts/validate-claims.py core/decisions/ --decisions
      - name: Upstream pins (E12/E13/W5) against the pinned ref
        # The principle repo is private; cloning it needs a token with read access.
        # Provide it as the secret UPSTREAM_TOKEN (a PAT or a fine-grained token scoped to
        # actor-indexed-determination:contents:read). Without it the clone step is skipped with a
        # warning rather than failing the build, so forks without the secret still run local checks.
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_TOKEN" ]; then
            echo "::warning::UPSTREAM_TOKEN not set — skipping upstream pin resolution (private principle repo)."
            exit 0
          fi
          git config --global url."https://x-access-token:${UPSTREAM_TOKEN}@github.com/".insteadOf "https://github.com/"
          python3 validate-core-order.py core/
