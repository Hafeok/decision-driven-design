format: 1
id: DDD-measure-11
kind: conceptual
statement: >
  The measure prices the verdict, not the search: H(verdict) is a property of the verdict
  function and the ground distribution and says nothing about the cost of computing a
  correct answer. Two tasks with identical verdict entropy can differ unboundedly in
  generation cost, so the measure must not be read as pricing generation.
status: reported
region: closing predicates only (where H(verdict) exists)
credits: >
  Cook-Levin (1971), via DDD-frame-06: satisfiability is linear to check yet NP-hard to
  solve — identical verdict entropy, unbounded generation-cost gap.
evidence:
- kind: derivation
  ref: core/09-the-measure.md
  note: >-
    §7 "A second silence, inside the boundary" and §8 caveat 1 — a lookup table and a SAT
    instance over the same input space carry the same H(verdict)
falsifier: >
  A task family in which verdict entropy bounds generation cost, so that the measure does
  price the search.
owner: paper-1
changed: v4.5
notes: >
  Extracted in the core/09 conversion; added to canon at v4.5 (generation-cost
  correction). The measure-framed companion of DDD-frame-06 (the closure/generation-cost
  separation, established) — the two variables this release separates must not be re-fused
  through the measure.
