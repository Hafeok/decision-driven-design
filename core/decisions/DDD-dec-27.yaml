  The upstream half of this session is DDD-dec-26 (the two mints, the three non-deltas, the
  ground-provenance ineligibility ruling, and the reading of DDD-dec-24's minimality clause).
  This decision does not restate those rulings; it applies them.

  Scope discipline. The charter forbids bundling. Untouched here: the Q27 wave, the term:training
  supersession question, the ref-staleness instrument, any path generator, any ActorClass axis,
  any Diataxis restructuring, and any website work.
