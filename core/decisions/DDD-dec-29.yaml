notes: |
  [PROPOSED] Filed at the staging step of the floor-lineage session, before the upstream merge.
  Emil ratifies.

  Numbering: decisions share one id space across the principle repository and this one, contiguous
  at 01-28 before this file. 29 is this advance. There is no separate upstream decision node for
  the supersession — Emil's GATE 1 ruling governs it upstream, and this repository files the pin
  consequence, which is the only cross-repo object the change creates.

  ## The ordering, and the near-miss it is written to avoid

  DDD-dec-28 records a near-miss worth repeating here because this session is in the same
  position: an instruction to bump arrived once before the merge had happened, and the bump was
  correctly not made, because "a pin file naming a ref that does not exist is a false record, and
  a decision filed alongside it would have asserted an acceptance that had not occurred."

  The same asymmetry applies now. graph/upstream.yaml pins a tag, never a branch, and the checker
  shallow-clones that ref, so naming v5.9.0 before the tag is cut would fail E12 on all 67 pins at
  once. Per CLAUDE.md, merging releases/v5.9.0.yaml to the default branch is what cuts the tag;
  there is no manual git tag step.

  The sequence is therefore: upstream pull request merges and v5.9.0 is cut -> this repository
  advances ref and re-instruments term:floor's content_hash -> the prediction above is verified
  against what actually fires -> Paper A's Appendix A is regenerated against the tag and re-read
  independently. Until then the pin stays at v5.8.0 and this decision stays [PROPOSED].

  DDD-dec-10 offers the alternative of pinning the staged upstream branch during staging, and it
  is deliberately not taken. That precedent moved a repository-internal pin file only. Here the
  same ref is also written into a published manuscript — papers/paper-a/paper-a.md's front matter
  declares the projection's ref, and Appendix A's generated footer names it — so staging against a
  branch would put a branch sha into a paper. That is the defect the pin discipline exists to
  prevent, and the ordering constraint was approved on that ground at GATE 2.

  ## Inherited freight

  This file carries a [PROPOSED] banner, and Paper A successor item 4 is open on exactly that:
  [PROPOSED] banners surviving inside a cut tag. This decision inherits the item rather than
  resolving it, and is named in it at close.
