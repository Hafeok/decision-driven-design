notes: |
  Numbering: decisions share one id space across the principle repository and this one. 33 is the
  highest before this file (upstream, at v5.12.0), so this advance is 34.

  Filed at the advance rather than staged [PROPOSED], because the tag it pins already existed:
  v5.12.0 resolves to 81f6929, verified as the principle repository's default-branch head before
  anything moved. The DDD-dec-28/29 near-miss — an instruction to bump arriving before the tag was
  cut — does not apply here, and the file lands ratified rather than being tidied later.

  The ordering constraint from DDD-dec-29 still binds and was followed: the ref written into
  graph/upstream.yaml is also written into a published manuscript, so pinning a branch during
  staging would put a branch sha into a paper. Tag first, always.

  ## What the two-stage verification cost, and why it is worth it

  Nothing but one extra checker run. The alternative — advance ref and hashes together — produces
  a green run whether or not the prediction was right, which is presumed discharge in its exact
  form: the artefact recording the pass identical to the artefact recording the skip. Three
  advances have now been verified this way (DDD-dec-28, DDD-dec-29, this one) and the prediction
  has held each time, which is an argument for keeping the method rather than for dropping it.
