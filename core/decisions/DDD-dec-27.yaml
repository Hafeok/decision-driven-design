format: 1
id: DDD-dec-27
kind: decision
statement: |
  The determination learning track files at projections/tracks/01-determination.md as a deliberate first instance of the projections/ tree rather than a general rule closing way-of-working §8 OPEN 3; its rung order is a declared judgement-mediated decision with a named owner and not a derivation from the canon dependency order; and its ground-provenance material is carried as track-native scaffolding marked non-canon at each point of use, with a Q27 revision obligation borne by DDD-track-01.
principal: Emil
made: 2026-08-18, Track 1 session (Gate 1 accepted; Gate 2 proposing rungs 1-5)
resolution: |
  [PROPOSED — Emil ratifies. Nothing below is settled until he does.]

  ## 1. projections/ is created; OPEN 3 stays open

  The tree is prescribed by meta/way-of-working.md §1 (the three layers) and written out in §5's
  repo-structure block. It stood unbuilt through the split; migration-report.md records its
  absence at that time. Creating it realises the specification rather than extending it, which is
  why this is a filing decision and not a charter change.

  Three files: projections/README.md, projections/tracks/README.md, and
  projections/tracks/01-determination.md.

  **What this does not settle, stated so it cannot be miscited.** Way-of-working §8 OPEN 3 asks
  whether projections/ holds rendered artifacts or manifests-plus-pointers *when the artifact
  lives elsewhere*. That is the question, and it is untouched here. The track is filed as a
  rendered artifact because it lives in this repository and has nowhere else to live — the
  elsewhere case never arises for it. **One instance, not a general rule.** A later reader must
  not cite this filing as the precedent that closed OPEN 3; OPEN 3 closes when someone rules on
  the elsewhere case, which this session does not.

  ## 2. Audience is a manifest field, not a path segment

  Tracks file audience-general. A track's content is Layer 1 and actor-general; only its worked
  example is domain-specific. Filing by example domain would put a governance implementer's
  track and a canon contributor's track in different trees for the same register, which is the
  wrong shape for the same reason the arrangement rather than the executor is the unit of
  comparison. The software audience of track 01 is recorded in its manifest.

  ## 3. The rung order is declared, not derived

  The order of the ten rungs is **a decision made by a named owner**, resolved at
  principal-level, and it is deliberately not a derivation from the canon dependency order.

  The dependency order is a **constraint** the order satisfies — no rung may require vocabulary a
  later rung introduces, and Gate 3 states that check explicitly. Satisfying a constraint is not
  the same act as being produced by it. Deriving the order mechanically and calling it settled
  would be presumed discharge in this repository's own sense: the artefact recording the skip
  would be identical to the artefact recording the choice, and nobody could tell afterwards
  whether the sequence was chosen or fallen into.

  Two orderings are live and are not resolved at this gate, per the session charter: whether the
  worked example survives contact with junior engineers or a business-line example is stronger,
  and whether rung 7 (closure) belongs before rung 5 (commitment level) on the argument that
  closure conditions which commitment levels are available at all. Both carry to Gate 3 as open.

  ## 4. Ground provenance — the ruling applied

  Rung 3's canon content is the definition and nothing more: a fact belongs to ground when
  information about it can change the resolution or its acceptance status beyond the declared
  tolerance. That is what the rung teaches and what the track claim rests on.

  The five-way taxonomy (controlled, observed, inferred, institutional, missing) is **expository
  scaffolding, not a partition claim**. It is marked track-native and non-canon **in line at the
  point of use**, inside the rung, so a reader arriving at rung 3 sees the status without leaving
  the document — a projection manifest alone does not satisfy the status-floor rule for a
  practice-facing surface. The institutional row carries its own flag naming Q27 as the open
  mechanism.

  **The revision trigger is a positive obligation, not a note.** A Q27 landing *requires* the
  track to be revised, and DDD-track-01 carries the dependency so the requirement is discoverable
  from the claim graph rather than only from this decision record. DDD-track-01 files at Gate 3
  with the track-level falsifier.

  ## 5. Pins added, no ref advance

  Fourteen ids the track cites by ddd:ref were added to graph/upstream.yaml **at the existing ref
  (v5.7.0)**: term:determinable, term:determinate, term:tolerance, term:decision,
  term:admission-test, term:governing-decision, term:ground, term:actor, term:arrangement,
  term:judgment, DDD-ground-02, DDD-ground-05, DDD-frame-02, DDD-frame-13. No advance is proposed
  in this act.

  The reason is instrumental, not tidiness: W5 fires on a ddd:ref to an unpinned id anywhere
  under the repository root, so a track that cites canon without pinning it is a teaching surface
  that can go stale in silence. That is DDD-agent-01's failure mode — basis loss — on a surface
  where it reaches learners.

  The two Track 1 mints, term:commitment-level and term:residual-discretion, are **deliberately
  not pinned**: they do not exist at v5.7.0 and pinning them would fire E12. Rungs 5 and 6 cite
  them in prose, carry no ddd:ref marker, and say plainly at the point of use that the marker and
  pin land at the advance to v5.8.0 on Emil's acceptance of the upstream PR. Rungs 6-10 add their
  own pins at Gate 3.

  ## 7. The linear-extension check — one reading passes, one FAILS

  The charter requires the rung order to be a linear extension of the canon dependency partial
  order. Both readings were computed, not asserted; the scripts are committed beside this
  decision (meta/sessions/2026-08-18-track-1-determination/check-*.py).

  ### 7a. Document granularity — FAILS, 20 forward edges

  Canon records its dependency order in one place: each core document's ddd:contract, enforced by
  validate-core-order.py. Lifting it to terms — term X depends on term Y iff X's establishing
  document requires Y, transitively — and testing the rung order against it gives **20 forward
  edges**, over 121 both-taught dependency pairs. They are not scattered. They concentrate in one
  place: **the track teaches four core/01 terms late** — escape at rung 9, assurance, encoded and
  mechanical at rung 8 — while teaching core/02's governing-decision at rung 2, core/03's
  acceptance-predicate and closure at rung 7, and core/14's commitment-level and
  residual-discretion at rungs 5 and 6.

  This is not a drafting defect and no amount of redrafting removes it. It is a property of the
  charter's specified rung order: escape is canon's earliest vocabulary and the track's climax.
  Reporting it rather than quietly redefining the check is the point of this paragraph.

  **Why the failing check may nonetheless be the wrong instrument.** The order it tests over-
  approximates. "X depends on Y" is derived from "X's home document's argument uses Y", not from
  "X's definition needs Y" — and term:governing-decision, which the check says depends on actor,
  arrangement, escape and ground, is registry-only with no canonical text at all, so it can
  definitionally depend on nothing. Canon does not record a term-level dependency order anywhere.
  Constructing one is a wave of its own and is NOT proposed here.

  ### 7b. Self-containment — PASSES, with four declared forward pointers

  The reading stated in projections/tracks/README.md: no rung may need a word a later rung
  introduces. Checked against the track text. The first run found 11 forward uses; seven were
  drafting convenience and were removed. Four survive and are **declared in the track's manifest**
  rather than left to be noticed:

  - rung 3 and rung 5 use "assurance" inside verbatim quotations of DDD-ground-02 and
    DDD-frame-01. Deleting the word misquotes canon; DDD-frame-01's tuple has six coordinates or
    it is not the tuple.
  - rung 8 uses "escape risk" twice, which the charter's own rung-8 specification requires
    ("identical escape risk if neither is checked").

  Each passes canon's own deletion test and each is defined properly at its own rung. This is
  precisely canon's W1 discipline — 59 declared forward pointers stand at v5.7.0 under the same
  rule — applied to a projection.

  ### 7c. What Emil must rule

  Which reading governs. Three options, with the session's recommendation:

  - **(a) RECOMMENDED — self-containment governs; the charter constraint is restated to say so.**
    The document-granularity order is canon's *exposition* order, and a pedagogical path has no
    obligation to reproduce it: core/01 states escape early because the principle needs it early,
    and the track reaches it last because a learner needs eight rungs of vocabulary before
    "decided by nobody" means anything. The two orders answer different questions.
  - **(b) Reorder the track to satisfy 7a.** This moves escape to roughly rung 3 and destroys the
    arc the charter specifies. Not recommended, and it would be a charter change, not a fix.
  - **(c) Construct a term-level dependency order upstream and check against that.** Honest, and
    a wave of its own. Explicitly not begun here.

  ## 8. The two open orderings — answered as judgements, not polls

  ### 8a. The retry example holds through rung 9 and strains at rung 10

  It is strongest at rung 7, where the closed/open split falls out of the example cleanly enough
  that the test and the question it fails to answer can both be shown in a dozen lines. It holds
  at 6, 8 and 9.

  **It strains at rung 10, which is the only rung that matters.** The worked discharge produces a
  record whose value does not change — 3 stays 3 — and whose declared assurance level is recorded
  as unmet. That is honest, and it is deliberately written to teach that recording a decision you
  do not yet meet is a successful discharge. But it gives the learner a first owned act that
  feels like transcription: they wrote down what was already true. A decision whose *value* is
  contested — a credit limit, a refund threshold, a retention period — would put a real
  disagreement in front of the learner at the moment they must name a principal, and naming a
  principal is easy when nothing is at stake.

  A lesser strain at rung 8: the on-call engineer changing a retry count live is slightly
  artificial for teams that do not permit it, though the cell is still legible.

  **The session does not resolve this**; the charter reserves it for Emil and the juniors have not
  seen the track. The recommendation, if a change is wanted, is not to replace the example — rungs
  1 through 9 depend on its concreteness — but to reconsider whether rung 10's *worked* instance
  must be the same decision as rungs 1-9's. That would relax "one decision unchanged across all
  ten rungs", which is a charter constraint and therefore Emil's to relax or keep.

  ### 8b. Rung 7 stays after rung 5 — recommendation, with the reason

  The argument for moving closure earlier is that closure conditions which commitment levels are
  available. **The session recommends keeping the charter's order**, for one reason that outranks
  the others:

  Closure conditions which commitments are **assurable**, not which are **available**. An
  arrangement can and constantly does commit at outcome level against a predicate that does not
  close — a literal in a source file governing peak-load behaviour is exactly that, and it is rung
  9's entire pathology. Teaching closure first would leave the learner believing the unassurable
  commitment is impossible, when the lesson is that it is easy, common, and invisible. The
  ordering that teaches "here is what an arrangement can fix in advance" before "here is what can
  be checked" is what makes rung 9's reveal land.

  Two corroborations from drafting rather than from argument. Rung 5 was written and needs nothing
  from rung 7: it stands alone. Rung 7 does need rung 5 — its closed/open table is about which
  half of the decision can be committed at outcome level and assured. The dependency, as drafted,
  runs 5 -> 7. And moving 7 before 5 makes the 7a check strictly worse, not better: it would put
  core/03 vocabulary at rung 5 and core/14 vocabulary at rung 7, leaving the core/01 inversion
  untouched.

  ## 6. Instrument note, deliberately not built

  The sorted-warning-line diff used at Gate 1 — comparing the validator's warning set against the
  baseline commit, so a green run distinguishes a new warning from a standing one — is recorded
  as a **candidate instrument and nothing more**. It is not generalised into a validator this
  session (Emil, Gate 1). Booked, unbuilt, unbundled.
