notes: |
  DRAFT-PENDING-RULING (GATE 5). The upstream session decision is DDD-dec-24 (upstream, citing
  upstream ground only, per the freight convention); this decision is its downstream
  counterpart, and the two reference each other's repositories only in the direction the
  dependency allows.
