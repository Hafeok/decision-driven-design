statement: |
  Under a sound terminating operational checker with complete declared ground, producer identity is not epistemically necessary for the checked property — and nothing more: not cheap generation, not normative completeness, not accountability.
status: projected
region: operationally closed predicates
falsifier: |
  A checked property whose epistemic standing still requires producer identity despite the stated conditions holding.
