statement: |
  Two act occurrences coincide when their ground positions are equal, whatever their layer paths.
status: projected
region: |
  Diachronic — compares occurrences. Needed because the layer path is part of the address
  (DDD-ground-06), so occurrences under different parents never share a full address.
evidence: []
falsifier: |
  Two occurrences at one ground position under different parents whose comparison misleads — behaviour that differs only because the parents impose different tolerance, read as a ground shift.
test: |
  T2b: every cross-parent coincidence in the first Phoenix slice is checked for inherited-tolerance differences (dry-run finding F-2).
breaks: |
  DDD-address-05's cross-parent grain.
