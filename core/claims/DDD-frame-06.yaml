format: 1
id: DDD-frame-06
kind: formal
statement: |
  Closure is distinct from generation cost: verification being cheap implies nothing about the density or accessibility of the acceptance region.
status: established
region: everywhere
credits: |
  Cook-Levin (1971): satisfiability is checkable in linear time yet NP-hard to solve. The theorem is Cook and Levin's; the identification of it as the closure/generation- cost separation is the framework's.
evidence:
- kind: derivation
  ref: core/07-determination-and-intelligence.md
  note: >-
    §5 records the fused falsifier (identity-degeneracy vs generation cost) as met by satisfiability,
    and keeps the receipt rather than deleting it
- kind: derivation
  ref: core/04-actors.md
  note: >-
    §2.2 — "Closure sets the floor to zero; generation cost is a second, independent variable";
    also core/09 §7 (v4.5), the second silence inside the boundary
falsifier: |
  A demonstrated entailment from operational closure to bounded generation cost.
owner: none
changed: v4.5
notes: |
  RESTATUSED reported -> established: the separation is theorem-backed (Cook-Levin) and canon records it as a met falsifier (core/07 §5), which is stronger than "reported". AMENDED evidence: the seed put a prose list ("proof discovery, cryptographic preimages, single-candidate predicates") in the ref field — malformed per spec §1 (ref is a repo path or citation) and those exemplars are not in canon. Replaced with the canon derivation refs and the satisfiability exemplar that is.
