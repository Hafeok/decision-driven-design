# Seed claims — extracted from projections, VERIFY AGAINST LIVE REPO BEFORE LANDING
# Source: foundation-revision §11 claim-status table + measure-paper-context + measure-paper-draft,
# all at canon v4.4/v4.5 as pinned in those documents. Emil: strike or restatus anything wrong.
# One file per claim once in core/claims/; single file here for review convenience.

format: 1        # applies to every claim below; per-file `format: 1` on split into core/claims/

claims:

  # ── measure ────────────────────────────────────────────────────────────────

  - id: DDD-measure-01
    kind: empirical
    statement: >
      Specification demand is verdict entropy: for a task whose acceptance predicate closes,
      the demand engineers experience as specification burden is H(V) over the ground
      distribution.
    status: projected
    region: closing predicates only
    evidence:
      - kind: computation
        ref: core/assets/measure-toy.py
        note: computable and non-degenerate; NOT confirmatory — the identification is a
          modelling claim
    falsifier: >
      A decomposition with high I(V;S) reliably has a cheap interface contract, or an actor
      with high I(V;E) performs no better unaided.
    breaks: >
      The measure paper's identification; Shannon untouched; the framework reverts to
      accounting discipline on this region.
    owner: paper-2
    changed: v4.5
    notes: >
      Verified against core/09 §1 and §8. Bounded by core/09 §7 (v4.5): H(V) prices the
      verdict, not the search — the identification must not be read as pricing
      generation cost.

  - id: DDD-measure-02
    kind: formal
    statement: >
      Given the identification (DDD-measure-01), conservation on the closing region is the
      chain rule of entropy: H(V) = I(V;X) + H(V|X) for any conditioning variable X.
    status: established
    region: closing predicates only, conditional on DDD-measure-01
    credits: The theorem is Shannon's (1948); only the identification is ours.
    evidence:
      - kind: derivation
        ref: core/09-the-measure.md
    falsifier: none — arithmetic; the conditional claim fires with DDD-measure-01
    owner: paper-1
    changed: v4.5

  - id: DDD-measure-03
    kind: formal
    statement: >
      The seam of a decomposition is I(V;S); a decomposition with cheaper parts has pre-paid
      more demand into the seam, and H(V|S) is minimised exactly when I(V;S) is maximised.
    status: reported
    region: closing predicates; exercised on the date task
    evidence:
      - kind: asset
        ref: core/assets/measure-toy.py
        note: both decompositions sum to 25.493 bits; reproduces exactly
    falsifier: >
      Any decomposition of a closed task whose parts-plus-seam total departs from H(V).
    breaks: DDD-measure-02's applicability to seams
    supersedes: DDD-measure-08
    owner: paper-1
    changed: v4.5

  - id: DDD-measure-04
    kind: formal
    statement: >
      Store allocation is actor-relative while total demand is actor-invariant: H(V) never
      mentions the actor; I(V;E) and H(V|E) split it per actor encoding.
    status: reported
    region: closing predicates; exercised on the date task, three actors
    evidence:
      - kind: asset
        ref: core/assets/measure-actor-allocation.py
        note: three actors, identical totals; reproduces exactly
    falsifier: >
      An actor encoding on a closed task whose I(V;E) + H(V|E) departs from H(V), or a
      demonstration that the "constant across actors" reading collapses into per-actor
      difficulty.
    breaks: the exact form of "fixed by the task, never by the system"
    owner: paper-1
    changed: v4.5

  - id: DDD-measure-05
    kind: empirical
    statement: >
      The identification survives an estimated channel: on a simulated RAG task, I(A;R) and
      H(A|R) estimated from samples sum to H(A) within estimator error across retrieval
      qualities.
    status: reported
    region: simulation only; a tractability result, not evidence of conservation
    evidence:
      - kind: asset
        ref: core/assets/measure-rag.py
        note: 40k samples; answer generated independently of retrieval, so closer to
          construction than measurement — never present as conservation in the wild
    falsifier: >
      Estimation on a real deployed retrieval system fails to recover the identity within
      error bars.
    owner: paper-1
    changed: v4.5
    notes: >
      FLAGGED prose tension, not harmonised: core/09 §6.3 presents this as "conservation
      of specification demand, measured on a deployed system pattern rather than a toy",
      which overstates relative to this claim's region — the answer is generated
      independently of retrieval by construction, so the run is closer to construction
      than measurement. The claim keeps the honest form; the prose is the bug. Emil review.

  - id: DDD-measure-06
    kind: formal
    statement: >
      The measure exists iff the acceptance predicate operationally closes; H(V) is undefined
      exactly where the framework's floor result locates non-zero floor.
    status: established
    region: everywhere — this claim is about the boundary itself
    evidence:
      - kind: derivation
        ref: core/09-the-measure.md
        note: near-definitional on the measure side; the force of the claim is the
          coincidence with core/03's independently derived floor. Claim the boundary as
          principled, not as convergent evidence.
    test: a task with an open predicate for which a defensible verdict function exists anyway
    owner: paper-1
    changed: v4.5

  - id: DDD-measure-07
    kind: empirical
    statement: >
      I(V;S) predicts the engineering cost of an interface (specification effort, boundary
      defect rate, time to stabilise); I(V;E) predicts which decisions an actor gets right
      unaided.
    status: projected
    region: closing predicates, production systems
    evidence: []
    falsifier: >
      Correlation absent after controlling for task difficulty, across several genuine
      decompositions in production.
    breaks: DDD-measure-01 — this is its falsifier run as a campaign
    owner: paper-2
    changed: v4.5

  - id: DDD-measure-08
    kind: formal
    statement: >
      RETIRED — "a better decomposition destroys demand." Cheaper parts were purchased by a
      higher-information seam; the destruction was an artifact of not counting I(V;S).
    status: retired
    region: —
    evidence:
      - kind: computation
        ref: core/assets/measure-toy.py
        note: the computation that overturned the canon position; the loop's first firing
    changed: v4.5
    notes: >
      Killed by the measure-toy computation (core/09 §4): the cheaper parts were bought
      by a higher-information seam. Corrected in canon at v4.1 (CHANGELOG 4.1,
      Corrected); the meta files carrying the destruction reading were harmonised at
      v4.4 (patch register P1). Superseded by DDD-measure-03, which carries the
      supersedes edge per spec §1 (corrections reference what they replaced).

  # ── frame (actor-indexed determination) ────────────────────────────────────

  - id: DDD-frame-01
    kind: conceptual
    statement: >
      Unresolved determination is indexed by the tuple ⟨task, ground, acceptance relation,
      tolerance, arrangement, assurance⟩, not by the task alone.
    status: projected
    region: everywhere the framework claims scope
    test: explanatory utility and counterexamples — a case where varying the arrangement
      cannot change any of the tuple-dependent properties
    owner: none        # program material; a synthesis paper at most
    changed: v4.4
    notes: >
      UNVERIFIED — Emil review. The six-tuple index ⟨task, ground, acceptance relation,
      tolerance, arrangement, assurance⟩ is Paper A / foundation-revision material and is
      NOT stated in any core/ document. Canon carries the components severally (tolerance
      and assurance separated in core/01 §"declared assurance level"; arrangement in
      core/05 §2; ground and acceptance predicate in core/00, core/03) but never as this
      named tuple. Cannot verify the tuple as a canon claim; flagged for Emil, not struck.

  - id: DDD-frame-02
    kind: conceptual
    statement: >
      Behavioural commitments attach at three levels — outcome, policy, principal — which
      compose and are not actor species.
    status: projected
    region: engineered arrangements
    test: boundary-case coverage; an arrangement whose commitments resist the three-level coding
    owner: none
    changed: v4.4
    notes: >
      UNVERIFIED — Emil review. The three commitment levels (outcome/policy/principal)
      appear only in the session-authored scaffolding (meta/way-of-working §4,
      meta/graph-tool-ontology §2) as the decision node's commitmentLevel, not in any
      core/ document as a claim about behavioural commitments. Cannot verify against
      canon; flagged, not struck.

  - id: DDD-frame-03
    kind: conceptual
    statement: >
      The source of a resolution and the mechanism assuring it are separate dimensions; the
      four-store model conflated them.
    status: projected
    region: engineered arrangements
    test: case-study coding reliability across independent coders
    owner: none
    changed: v4.5
    notes: >
      Verified against canon: core/05 §§1-2 (v4.5) makes accountability completeness a
      second axis "independent of pinning resolution" — the source axis (where the
      resolution's constraint attaches, core/04) and the assurance/accountability axis are
      separate, and core/05 §1 states the four-store partition "turns on a distinction it
      never draws". core/01 §"declared assurance level" (v4.5) separately splits tolerance
      from assurance. FLAGGED for Emil: the seed's historical clause "the four-store model
      conflated them" is the seed's gloss — canon says the store model did not draw the
      distinction, which is weaker than active conflation. Kept projected (conceptual;
      coding-reliability test unrun).

  - id: DDD-frame-04
    kind: empirical
    statement: >
      Escaped decisions — consequential resolutions with no adequate source-and-assurance
      combination — predict ungoverned failure modes and design-review findings.
    status: projected
    region: deployed systems and organisations
    evidence: []
    falsifier: >
      Escaped-decision analysis identifies nothing that ordinary workflow review does not,
      across a set of incident postmortems.
    owner: paper-4
    changed: v4.4
    notes: >
      Rests on the canon escaped-store concept (core/01; core/05 §1 "Escaped with an
      executor attached"), but the predictive claim over incident data is unexercised —
      correctly projected. Not canon-verifiable beyond the underlying category; the
      empirical prediction is paper-4 work.

  - id: DDD-frame-05
    kind: formal
    statement: >
      Under a sound terminating operational checker with complete declared ground, producer
      identity is not epistemically necessary for the checked property — and nothing more:
      not cheap generation, not normative completeness, not accountability.
    status: projected
    region: operationally closed predicates
    falsifier: >
      A checked property whose epistemic standing still requires producer identity despite
      the stated conditions holding.
    owner: none        # candidate for formalisation alongside paper-3
    changed: v4.5
    notes: >
      Verified against canon: core/07 §2 states the trust form directly — "confidence in
      an output need not depend on attributing intelligence to its producer" — and §§2-3
      supply the "and nothing more" scoping (closure does not price generation, per the
      v4.5 generation-cost correction and core/09 §7; accountability is separate, core/05).
      Kept projected: core/07 carries it as a derivation, unexercised, and it is named a
      candidate for formalisation. Verified as stated, not restatused.

  - id: DDD-frame-06
    kind: formal
    statement: >
      Closure is distinct from generation cost: verification being cheap implies nothing
      about the density or accessibility of the acceptance region.
    status: established
    region: everywhere
    credits: >
      Cook-Levin (1971): satisfiability is checkable in linear time yet NP-hard to solve.
      The theorem is Cook and Levin's; the identification of it as the closure/generation-
      cost separation is the framework's.
    evidence:
      - kind: derivation
        ref: core/07-determination-and-intelligence.md
        note: §5 records the fused falsifier (identity-degeneracy vs generation cost) as
          met by satisfiability, and keeps the receipt rather than deleting it
      - kind: derivation
        ref: core/04-actors.md
        note: §2.2 — "Closure sets the floor to zero; generation cost is a second,
          independent variable"; also core/09 §7 (v4.5), the second silence inside the
          boundary
    falsifier: >
      A demonstrated entailment from operational closure to bounded generation cost.
    owner: none
    changed: v4.5
    notes: >
      RESTATUSED reported -> established: the separation is theorem-backed (Cook-Levin)
      and canon records it as a met falsifier (core/07 §5), which is stronger than
      "reported". AMENDED evidence: the seed put a prose list ("proof discovery,
      cryptographic preimages, single-candidate predicates") in the ref field — malformed
      per spec §1 (ref is a repo path or citation) and those exemplars are not in canon.
      Replaced with the canon derivation refs and the satisfiability exemplar that is.

  - id: DDD-frame-07
    kind: empirical
    statement: >
      Operational evaluability, feedback density, and ground accessibility predict the
      comparative advantage of computationally assisted arrangements over unaided situated
      judgment, after controlling for difficulty and resources (H1–H5).
    status: projected
    region: task markets and deployed arrangements
    evidence: []
    falsifier: >
      Evaluability adds no predictive variance after controls, or highly evaluable tasks
      systematically favour unaided judgment at equal ground and checking access.
    owner: paper-4
    changed: v4.4
    notes: >
      UNVERIFIED — Emil review. H1-H5 is the arrangement-study (paper-4) hypothesis set,
      named in the program roadmap (meta/way-of-working §4, paper-4 row) but the
      hypotheses themselves are Paper A / foundation-revision material, not stated in any
      core/ document. Correctly projected and unexercised; flagged as not canon-grounded.

  - id: DDD-frame-08
    kind: normative
    statement: >
      Accountability is a relation (attribution, persistent principal, authority linkage,
      stake, sanction path), not an intrinsic capacity; an arrangement naming an executor
      but no principal is incomplete.
    status: projected
    region: consequential deployments
    test: stakeholder and case studies — completeness of the relation predicting trust and
      remediation outcomes better than executor identity
    owner: paper-4
    changed: v4.5
    notes: >
      Conceptual core verified against canon: core/05 (v4.5, P1) states "Accountability
      completeness is a property of an arrangement, not a capacity of an actor... linked to
      a persistent responsible principal, an attributable record, a defined stake, and an
      enforceable consequence path", and core/01/core/05 §1 "a judgment allocation naming
      no accountable party is... Escaped with an executor attached". Kept projected: the
      normative prediction (relation-completeness predicting trust/remediation) is
      unexercised, needing the stated case studies.

  - id: DDD-frame-09
    kind: formal
    statement: >
      RETIRED — "closed predicates make intelligence unnecessary." Does not follow from
      producer-independence under verification; generation may still require whatever
      capability the search demands.
    status: retired
    region: —
    changed: v4.5
    notes: >
      Verified retired against canon: core/07 §2 carries only the scoped form — "A closing
      predicate makes intelligence unnecessary FOR TRUST" — and §5 records the unscoped
      cost reading as a met falsifier (satisfiability: linear to check, NP-hard to solve),
      retiring the generation-cost reading rather than the floor result. The v4.5
      generation-cost correction (core/03, core/04 §2, core/07 §§2,4,4.2) is where canon
      landed this. Corrected by DDD-frame-05 (producer-independence is for trust only) and
      DDD-frame-06 (closure ≠ generation cost) jointly. AMENDED: the seed's malformed
      "supersedes: none — corrected by..." moved here to notes; retired claims need
      supersedes or a notes entry naming what killed it (spec §2), and no single claim
      supersedes this one.

  - id: DDD-frame-10
    kind: formal
    statement: >
      Determination demand is conserved as a scalar across arbitrary re-arrangements,
      actor-generally and including open predicates.
    status: projected
    region: claimed everywhere; ESTABLISHED ONLY on closing predicates via DDD-measure-02
    falsifier: >
      A formalisation attempt yielding no stable measure off the closing region, persisting
      after the escape/judgment split (paper-3) lands.
    breaks: the framework's strongest general reading; the bounded reading survives
    owner: paper-3
    changed: v4.5
    notes: >
      Verified against canon: core/09 §7 draws the boundary — "conservation of
      specification demand is a theorem for closing predicates... For open predicates it
      remains what it was — a principle, an accounting discipline, not a measured
      invariant" — and core/01 §"the statement" keeps the register a principle. The
      established-only-on-closing region matches DDD-measure-02 (via the chain rule). The
      general open-predicate reading is correctly projected; canon does not support it as
      more than a principle.

  # ── floor ──────────────────────────────────────────────────────────────────

  - id: DDD-floor-01
    kind: formal
    statement: >
      H(V|X) bundles judged and escaped demand; cleaving them requires an actor-capacity
      model, and demand escapes where residual demand exceeds effective capacity
      min(C_hold, C_resolve) AND the shed decisions carry no verifier — escape is the
      intersection overflow ∩ open, with overflow alone producing retries, not escape.
    status: reported
    region: >
      closing/open decision mixes on hard- and soft-capacity toy actors; the formal
      write-up (paper-3) and any real-actor calibration remain open
    evidence:
      - kind: derivation
        ref: core/10-the-floor-mechanism.md
        note: escape = overflow ∩ open (§3); p_err = Hb^-1(1 - C/n) derived from
          rate-distortion (§4.1), not assumed
      - kind: asset
        ref: core/assets/floor-mechanism.py
        note: hard-capacity table of core/10 §3 reproduces exactly (escape
          0/2.49/3.99/5.99/9.97; all-verified escape 0 at every capacity)
      - kind: asset
        ref: core/assets/perr-rate-distortion.py
        note: derived p_err reproduces core/10 §4 limits (r>=1 -> 0, r->0 -> 0.5);
          soft-capacity structure survives the substitution
    falsifier: >
      An actor whose observed escape departs from the intersection — escape without
      overflow, escape on decisions with a held verifier, or no escape past capacity on
      open decisions.
    credits: >
      Rate-distortion theory is Shannon's; p_err = Hb^-1(1 - C/n) is the standard bound.
      The identification of the escape mechanism with the intersection is ours.
    owner: paper-3
    changed: v4.5
    notes: >
      Restatused projected -> reported in the verification pass: the seed, drafted from
      projections pinned at v4.4/v4.5, treated the actor-capacity model as future work,
      but live canon supplies it — core/10 derives and demonstrates it, and both assets
      reproduce. The seed statement also omitted the open conjunct (overflow alone is
      retries, not escape — core/10 §3); amended to the intersection form.

