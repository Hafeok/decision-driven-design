# graph/upstream.yaml — cross-repo dependency pins (DDD-agent-01 applied to repositories)
#
# decision-driven-design depends on the actor-indexed-determination principle repo; never the
# reverse. Every dependency is pinned at version AND status. The checker in
# validate-core-order.py resolves these against the pinned ref (a shallow clone into a temp dir)
# and raises:
#   E12  a pinned id no longer exists upstream at ref
#   E13  upstream canonical_md at ref differs from what a DDD doc embeds (only for embedded ids)
#   W5   an upstream claim's status changed since status_at_pin — an escaped decision until the
#        pin is consciously advanced (a governed decision, not a mechanical bump)
#
# Advancing a pin is a decision: when a pinned status has moved, record the advance as a decision
# under core/decisions/ before bumping status_at_pin.

format: upstream/v1
upstream:
  repo: https://github.com/Hafeok/actor-indexed-determination
  # Advanced v5.0.0 -> v5.2.0 on Emil's upstream acceptance (merge e86fd23, tagged v5.2.0);
  # the advance is recorded in core/decisions/DDD-dec-10.
  # Advanced v5.2.0 -> v5.3.0 on Emil's upstream acceptance of the Wave 2 PR (merge 1db6772,
  # tagged v5.3.0); Wave 2 rulings recorded in DDD-dec-11/13/14 here and DDD-dec-12 upstream.
  # Advanced v5.3.0 -> v5.4.0 on Emil's upstream acceptance of the escape reconciliation PR
  # (merge 3bf739e, tagged v5.4.0); the ruling is DDD-dec-15 upstream, the advance DDD-dec-16
  # here. No pin added, none removed, and DDD-floor-01 stays at status_at_pin: reported — its
  # statement moved, its status did not, so nothing in E12/E13/W5 forced this advance. It is
  # governed rather than mechanical, which is why it carries a decision.
  # Advanced v5.4.0 -> v5.5.0 on Emil's upstream acceptance of the vocabulary-and-delivery PR
  # (merge e8663b8, tagged v5.5.0 on Emil's approval, 2026-08-16); the session ruling is
  # DDD-dec-17 upstream, the advance DDD-dec-18 here. Two pins added (term:delivery,
  # DDD-delivery-01 — the basis of DDD-delivery-04). The advance was staged against the session
  # branch and bumped to the tag on acceptance, per the DDD-dec-10/16 pattern. It is governed
  # rather than mechanical for the recorded reason: DDD-cost-09's region moved at v5.5 while
  # its status stayed projected — the statement-moved-silently case a second time, and W5 was
  # silent throughout.
  # Advanced v5.5.0 -> v5.6.0 at the Wave 3 session (2026-08-18), recording a MISS: this advance
  # should have accompanied Emil's acceptance of the freight PR (upstream merge 01db788, tagged
  # v5.6.0) and did not — caught by the Wave 3 GATE 1 survey, not by the instrument, because W6
  # resolves against the ref you pinned and a missed advance leaves that ref internally
  # consistent. The advance is DDD-dec-25 here; it fired nothing (0 basis-loss, 0 content-drift
  # — v5.6.0's one pinned-claim change, DDD-floor-01, was notes-only, outside the instrumented
  # fields). On Emil's acceptance of the Wave 3 upstream PR the ref bumps to v5.7.0 per the
  # DDD-dec-10/16/18 pattern; predicted firing at that bump: none (DDD-frame-01's Wave 3 change
  # is notes-only; frame-02/03/07 are not pinned), with pins for the new upstream nodes the
  # annotations rest on (DDD-frame-14; DDD-hyp-04/05) added at the same act, per DDD-dec-25.
  ref: v5.6.0                       # tag, never a branch
