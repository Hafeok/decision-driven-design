statement: |
  Escape is doubly costly: escaped residual never reaches the predicate, so it generates no verdict — ungoverned now and invisible to maturation. Escaped demand cannot be learned out of.
status: projected
region: |
  The volume layer; the escaped store's intersection with the return channel.
evidence: []
falsifier: |
  Demonstrated maturation on distinctions whose resolutions were never checked.
breaks: |
  The double-cost argument for escape-prevention at the volume layer; escape would revert to a single-period governance cost.
