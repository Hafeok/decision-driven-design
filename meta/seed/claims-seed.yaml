    status: projected
    region: this repo first; operational work second
    evidence: []
    falsifier: >
      After one full canon-revision cycle, staleness or demotion still requires manual
      audit, or maintenance exceeds the audit cost replaced.
    breaks: nothing in core/ — the discipline reverts to convention and grep
    owner: none
    changed: v4.5
    notes: >
      Session-authored; but the repo independently supports the claim node itself: it is
      stated verbatim as DDD-tool-01 in meta/way-of-working §4 with this falsifier and
      "what breaks", and it is the declared basis of decisions DDD-dec-01..03. Verified as
      a faithful transcription of that canon node; the empirical reduction-of-cost
      prediction remains projected and unexercised (its first exercise is paper 1's
      feedback cycle, per meta/graph-tool-mvp §5). Not flagged UNVERIFIED — the node is in
      canon.

  # ── org ────────────────────────────────────────────────────────────────────

  - id: DDD-org-01
    kind: empirical
    statement: >
      Graph discipline — status floors at the consumer boundary, manifests, correction flow
      to a single canon — predicts organisational outcomes: pivot cost, trust damage from
      shipping projected claims as established, decision-review latency after thesis change.
    status: projected
    region: organisations; parked
    evidence: []
    falsifier: >
      Organisations measurably differing in graph discipline show no difference in pivot
      cost or correction latency after size and sector controls.
    owner: none        # paper-4 territory at the earliest
    changed: v4.5
    notes: >
      UNVERIFIED — session-authored; Emil review. The org-design projection is parked per
      meta/way-of-working §4; no core/ or meta/ document states this predictive claim. The
      underlying primitives (status floors, manifests, single-canon correction flow) are
      canon (meta/way-of-working §§2-3), but the organisational-outcome prediction is not.

  - id: DDD-org-02
    kind: empirical
    statement: >
      The Stable Dependency Principle, statused: decisions whose reversal cost exceeds what
      their basis claims' hazard can absorb (high commitment level on low-status claims)
      concentrate pivot cost and produce incident-discovered cascades; organisations cannot
      see these violations because their assumption layer carries no status field.
    status: projected
    region: organisations; the DDD graph as first instrument
    evidence: []
    falsifier: >
      Decisions flagged by fragility (hazard × afferent decisions × reversal cost) generate
      no more rework or incident findings than unflagged decisions of equal size.
    breaks: the mechanism under DDD-org-01; the correlation claim could survive without it
    credits: >
      Martin's Stable Dependency Principle; here the stability axis is measured (status,
      hazard) rather than computed from coupling.
    owner: none
    changed: v4.5
    notes: >
      UNVERIFIED — session-authored; Emil review. The Martin SDP credit is genuine canon
      prior art (meta/lineage-and-limits §1.12), but the statused-SDP organisational
      prediction here is session-authored and stated in no core/ or meta/ document.

  - id: DDD-org-03
    kind: empirical
    statement: >
      Priority as a governed decision: backlogs ordered by decisions basedOn statused
      value-claims — with claim priority set by value of information and decision priority
      by cost of delay, reversal cost, and basis readiness — churn less and predict delivered
      value better than intuition-ordered backlogs; roadmap churn is the cascade from
      silently demoted value-claims.
    status: projected
    region: product organisations; agile teams as the natural instrument
    evidence: []
    falsifier: >
      Teams with statused value-claims and explicit basedOn priority show no less roadmap
      churn or no better value prediction than matched intuition-ordered teams; or churn
      events do not trace to value-claim status changes on audit.
    breaks: >
      The PO-as-seam rendering loses its mechanism; the claim/decision split survives
      unchanged.
    credits: >
      Reinertsen (cost of delay, WSJF) for the economic inputs; Bezos's Type 1/Type 2
      doors, here given teeth as commitment levels setting status floors. The normative
      residue — value weights — stays a principal-level decision; the graph makes it
      auditable, not automatic.
    owner: none        # org projection; parked with DDD-org-01/02
    changed: v4.5
    notes: >
      UNVERIFIED — session-authored; Emil review. Reinertsen is canon prior art
      (meta/lineage-and-limits); the PO-as-seam / governed-priority prediction is
      session-authored and stated in no canon document. Depends on the commitment-level
      vocabulary that DDD-frame-02 also flags as not-yet-in-core/.

  - id: DDD-org-04
    kind: empirical
    statement: >
      Cross-domain retrodiction: the intensity of an industry's institutionalised graph
      discipline — permits, licensure, stage-gates, mandatory inspection — is predicted by
      reversal cost and feedback latency. Construction and manufacturing evolved formal
      status floors because irreversibility forced them; software's informality is explained
      by cheap retries, and its formalisation pressure rises with consequence and with
      agent-generated code collapsing generation cost while verification cost stands.
    status: projected
    region: cross-industry; historical and institutional analysis as the instrument
    evidence: []
    falsifier: >
      Industries matched on reversal cost and feedback latency showing grossly different
      discipline intensity, or discipline intensity tracking regulation-historical accident
      better than the two parameters after controls.
    breaks: >
      The org projection's claim to generality beyond software; the software-local claims
      (org-01..03) survive on their own instruments.
    credits: >
      The mapping targets are prior art in each field — building codes, licensure, Cooper's
      stage-gates, Toyota set-based engineering and A3; the claim is that two framework
      parameters predict their distribution, not that the institutions are new.
    owner: none        # cheapest evidence in the org area — analysis, not experiment
    changed: v4.5
    notes: >
      UNVERIFIED — session-authored; Emil review. Cross-domain retrodiction; no core/ or
      meta/ document states it. The reversal-cost/feedback-latency parameters are framework
      concepts (core/03, applications/sdlc) but their cross-industry predictive use is
      session-authored.

  # ── agent ──────────────────────────────────────────────────────────────────


  - id: DDD-agent-01
    kind: empirical
    statement: >
      Long-running agent drift is escaped decisions caused by basis loss: context decay,
      compaction, and distractors remove claim nodes from the agent's ground, so later
      actions are decisions with no basedOn edge to the declared claims and revert to model
      priors. Grounding the agent in a persistent external claim graph — basis as query, not
      context residue, with per-decision claim citation — reduces drift relative to
      context-carried instruction.
    status: projected
    region: long-running LLM agent sessions; product-core agent surface as the instrument
    evidence:
      - kind: derivation
        ref: measure-rag distractor rows (DDD-measure-05)
        note: the temporal analogue — I(V;context) decaying over turns pushes demand from
          encoded back to judgment; drift is the session-length version of channel
          degradation. Flagged — extension not yet computed.
    falsifier: >
      Instrumented comparison shows basis coverage (fraction of actions citing valid claim
      refs) does not predict drift onset, or graph-grounded agents drift no less than
      context-carried baselines at matched capability.
    breaks: >
      The runtime escaped-decision check as a drift remedy; the ontology's claim/decision
      split survives — it just would not explain this failure mode.
    owner: none        # the most immediately exploitable claim in the seed — instrumentable
                       # on product-cli agent sessions at low cost
    changed: v4.5
    notes: >
      UNVERIFIED — session-authored; Emil review. Stated in no core/ or meta/ document.
      The measure-rag evidence entry is a claimed temporal ANALOGUE, not a run — the seed
      itself marks it "extension not yet computed", so it is not confirmatory; measure-rag
      reproduces (verified, DDD-measure-05) but the drift extension does not exist yet. The
      claim is agent-drift theory applied to this repo's own agents (the basis-as-query
      framing this branch's CLAUDE.md section instantiates).

  # ── sim (graph dynamics) ───────────────────────────────────────────────────

  - id: DDD-sim-01
    kind: empirical
    statement: >
      Cascade prediction: per-claim hazard rates derived from status, evidence, and falsifier
      specificity, propagated by Monte Carlo along basedOn and includes edges, predict
      realised review workload and cascade size after actual claim demotions.
    status: projected
    region: the DDD graph first; any statused claim/decision graph in principle
    evidence: []
    falsifier: >
      After hazard calibration on accumulated transition history, simulated cascade
      distributions predict realised post-demotion review workload no better than
