format: 1
id: DDD-dec-14
kind: decision
statement: |
  OPEN — the identity-unit question: what is the claimant identity whose calibration ledger accumulates — person, role, model version, model lineage, or arrangement? Deliberately unresolved; owner Emil.
principal: Emil
made: 2026-08-10, Wave 2 curation session (GATE F); filed open in-session
resolution: |
  OPEN. No resolution is recorded here, deliberately: the identity unit is a Decision Ledger
  PRD design decision, and resolving it in canon would pre-empt the design work. Conditional
  transfer note, as ruled: transfers when a Decision Ledger PRD exists in a repo Emil
  designates; until then this record is the decision's home, and any product-cli or L-track
  work touching the identity unit cites this ID rather than resolving it.
basedOn:
  - DDD-cost-24
  - DDD-dec-13
notes: |
  The validity condition of DDD-cost-24 is what makes this question load-bearing: the ledger
  exists only for identities that outlive their verdict horizons, so the choice of identity
  unit decides which actors the instrument can certify at all — model-version churn against
  open-claim horizons is the type case (§11(c)'s turnover bound, pending GATE G).

  Annotation, 2026-08-17 (freight session, item G-8; source: upstream
  meta/holding-note-addendum-determinables.md, Q37, whose own routing line reads "the dec-14
  annotation immediately, one line"). This decision stays OPEN and is NOT resolved here.

  Q37 reframes the question rather than answering it. Under ground-indexed determination —
  determination records indexed by ground (position, as-of, delivery, verdict), with the actor a
  projection over the registry and capability inferred from the act stream rather than posited —
  the identity unit becomes the JOIN KEY for one capability profile, and cross-version transfer
  becomes profile inheritance, partial and per-region. That is a smaller question than the
  ontological one this node currently poses: not "what kind of thing is the claimant identity"
  but "what does the act stream join on".

  Two things the reframing does not touch. DDD-cost-24's validity condition still decides which
  actors the instrument can certify at all — a profile whose identity does not outlive its verdict
  horizons is not rescued by being a join key. And the accountable principal refuses the inversion
  outright: stake, sanction and consequence-bearing are institutional and are not inferable from
  any act stream, so ground-indexing covers what an arrangement can resolve and never who answers.
  Q37 states that carve as shipping with it, and the register guard verbatim: profiles describe
  arrangements; a person is a component; this rates nothing and nobody.

  Sequencing, recorded so the resolving session inherits it: take Q29 and Q37 together. Q37's own
  argument is that six of Q29's seven parameters are ground-relations — "the profile was always a
  ground-profile wearing a species name" — so resolving the identity unit from Q29's parameter set
  alone would resolve it against a framing Q37 supersedes. Q37 routes downstream, after the
  Q25/Q27 wave; this node's conditional transfer to a Decision Ledger PRD repo is unaffected and
  still governs.
