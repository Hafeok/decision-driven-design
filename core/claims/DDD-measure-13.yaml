statement: >
  The maturation/funnel asymptote is H(verdict) − I(verdict;S_encoded): as encoded
  decomposition harvests more of the verdict, runtime demand falls toward the residual the
  encoding has not captured, never below what the open part of the predicate leaves
  undetermined.
