<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">

  <defs>
    <!-- hatch for the escaped store: a void, not a fill -->
    <pattern id="void" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C0576B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <!-- hatch for intrinsic floor: unreachable -->
    <pattern id="bedrock" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7C8794" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A94A0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D9A441"/>
    </marker>
    <marker id="arrowSteel" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4C7FA8"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#12161C"/>

  <!-- ================= HEADER ================= -->
  <text x="72" y="66" fill="#6B7683" font-size="11" letter-spacing="3.4">DECISION-DRIVEN DESIGN</text>
  <text x="72" y="104" fill="#EEF2F6" font-size="31" font-weight="600" letter-spacing="-0.4">The Law of Conservation of Specification Demand</text>
  <text x="72" y="132" fill="#8A94A0" font-size="13.5">For a task at a declared assurance level, specification demand is fixed by the task — never by the system.</text>
  <text x="72" y="152" fill="#8A94A0" font-size="13.5">Every governing decision gets made. The only choice is <tspan fill="#EEF2F6">by whom</tspan>, <tspan fill="#EEF2F6">when</tspan>, and <tspan fill="#EEF2F6">at what price</tspan>.</text>

  <line x1="72" y1="184" x2="1168" y2="184" stroke="#242C36" stroke-width="1"/>

  <!-- ================= THE BAR ================= -->
  <text x="72" y="222" fill="#6B7683" font-size="10.5" letter-spacing="2.4">ALLOCATION — TOTAL IS INVARIANT</text>

  <!-- fixed end-stops: the whole point -->
  <rect x="72" y="240" width="5" height="126" fill="#EEF2F6"/>
  <rect x="1163" y="240" width="5" height="126" fill="#EEF2F6"/>

  <!-- span rule + total label -->
  <line x1="77" y1="250" x2="1163" y2="250" stroke="#3A434F" stroke-width="1"/>
  <line x1="77" y1="356" x2="1163" y2="356" stroke="#3A434F" stroke-width="1"/>

  <!-- ENCODED: constraint form -->
  <rect x="77" y="256" width="286" height="94" fill="#4C7FA8" opacity="0.16"/>
  <rect x="77" y="256" width="286" height="94" fill="none" stroke="#4C7FA8" stroke-width="1.5"/>
  <rect x="77" y="256" width="286" height="4" fill="#4C7FA8"/>
  <text x="97" y="288" fill="#8FC0DF" font-size="14" font-weight="600" letter-spacing="0.6">ENCODED</text>
  <text x="97" y="308" fill="#7E8B98" font-size="11">constraint form · before the act</text>
  <text x="97" y="325" fill="#7E8B98" font-size="11">extra-actor · amortizes</text>
  <text x="97" y="342" fill="#5E6874" font-size="10.5">carried by an artifact</text>

  <!-- MECHANICAL VERIFICATION -->
  <rect x="363" y="256" width="228" height="94" fill="#6FB3C4" opacity="0.14"/>
  <rect x="363" y="256" width="228" height="94" fill="none" stroke="#6FB3C4" stroke-width="1.5"/>
  <rect x="363" y="256" width="228" height="4" fill="#6FB3C4"/>
  <text x="383" y="288" fill="#9AD3E0" font-size="14" font-weight="600" letter-spacing="0.6">MECHANICAL</text>
  <text x="383" y="304" fill="#9AD3E0" font-size="14" font-weight="600" letter-spacing="0.6">VERIFICATION</text>
  <text x="383" y="324" fill="#7E8B98" font-size="11">criterion form · after the act</text>
  <text x="383" y="342" fill="#5E6874" font-size="10.5">same specification, later binding</text>

  <!-- brace: the two encoded forms -->
  <path d="M77 366 L77 374 L591 374 L591 366" fill="none" stroke="#4C7FA8" stroke-width="1" opacity="0.6"/>
  <path d="M334 374 L334 382" stroke="#4C7FA8" stroke-width="1" opacity="0.6"/>
  <text x="344" y="392" fill="#6E90A8" font-size="10.5">two encoded forms of the same decision · redundancy permitted · no double-counting</text>

  <!-- JUDGMENT -->
  <rect x="591" y="256" width="286" height="94" fill="#D9A441" opacity="0.15"/>
  <rect x="591" y="256" width="286" height="94" fill="none" stroke="#D9A441" stroke-width="1.5"/>
  <rect x="591" y="256" width="286" height="4" fill="#D9A441"/>
  <text x="611" y="288" fill="#E8C67E" font-size="14" font-weight="600" letter-spacing="0.6">JUDGMENT</text>
  <text x="611" y="308" fill="#7E8B98" font-size="11">per-run · by a designated actor</text>
  <text x="611" y="325" fill="#7E8B98" font-size="11">from unencoded knowledge</text>
  <text x="611" y="342" fill="#5E6874" font-size="10.5">does not amortize · walks out the door</text>

  <!-- ESCAPED: a void, not a box -->
  <rect x="877" y="256" width="286" height="94" fill="url(#void)"/>
  <rect x="877" y="256" width="286" height="94" fill="none" stroke="#C0576B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="897" y="288" fill="#E08398" font-size="14" font-weight="600" letter-spacing="0.6">ESCAPED</text>
  <text x="897" y="308" fill="#7E8B98" font-size="11">decided by nobody</text>
  <text x="897" y="325" fill="#7E8B98" font-size="11">= defect exposure</text>
  <text x="897" y="342" fill="#5E6874" font-size="10.5">the only forbidden state: uncovered + unpriced</text>

  <!-- the conservation statement, under the bar -->
  <text x="72" y="418" fill="#EEF2F6" font-size="12.5">The bar cannot widen and cannot narrow.</text>
  <text x="72" y="437" fill="#8A94A0" font-size="12.5">Shrink one store and the demand does not vanish — it moves. Reduce encoding and it lands in judgment, or it escapes.</text>

  <!-- lateral movement arrows -->
  <line x1="520" y1="462" x2="440" y2="462" stroke="#8A94A0" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <line x1="560" y1="462" x2="640" y2="462" stroke="#8A94A0" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="700" y="466" fill="#6B7683" font-size="10.5">demand relocates sideways · it never leaves</text>

  <line x1="72" y1="496" x2="1168" y2="496" stroke="#242C36" stroke-width="1"/>

  <!-- ================= ACTORS ================= -->
  <text x="72" y="532" fill="#6B7683" font-size="10.5" letter-spacing="2.4">ACTORS — ONLY THE JUDGMENT STORE IS CARRIED BY ONE</text>

  <!-- tether from judgment store down to the actor panel -->
  <path d="M734 350 L734 508 L734 572 L687 572" stroke="#D9A441" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.55" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- actor spectrum -->
  <text x="72" y="560" fill="#8A94A0" font-size="12">An actor is anything that makes decisions. They differ in <tspan fill="#EEF2F6">how tightly you can pin them</tspan>.</text>

  <!-- three actors -->
  <g>
    <rect x="72" y="580" width="230" height="106" fill="#1A2028" stroke="#2E3742" stroke-width="1"/>
    <rect x="72" y="580" width="230" height="3" fill="#7C8794"/>
    <text x="90" y="608" fill="#EEF2F6" font-size="13" font-weight="600">CLASSICAL PROGRAM</text>
    <text x="90" y="630" fill="#7C8794" font-size="11">pinned <tspan fill="#B8C2CC">by value</tspan></text>
    <text x="90" y="650" fill="#5E6874" font-size="10.5">degenerate actor —</text>
    <text x="90" y="666" fill="#5E6874" font-size="10.5">all decisions pre-made</text>
  </g>

  <g>
    <rect x="322" y="580" width="230" height="106" fill="#1A2028" stroke="#4C7FA8" stroke-width="1"/>
    <rect x="322" y="580" width="230" height="3" fill="#4C7FA8"/>
    <text x="340" y="608" fill="#EEF2F6" font-size="13" font-weight="600">MODEL</text>
    <text x="340" y="630" fill="#7C8794" font-size="11">pinned <tspan fill="#8FC0DF">by binding</tspan></text>
    <text x="340" y="650" fill="#5E6874" font-size="10.5">first non-deterministic actor</text>
    <text x="340" y="666" fill="#5E6874" font-size="10.5">whose distribution can be frozen</text>
  </g>

  <g>
    <rect x="572" y="580" width="230" height="106" fill="#1A2028" stroke="#D9A441" stroke-width="1"/>
    <rect x="572" y="580" width="230" height="3" fill="#D9A441"/>
    <text x="590" y="608" fill="#EEF2F6" font-size="13" font-weight="600">HUMAN</text>
    <text x="590" y="630" fill="#7C8794" font-size="11">pinned <tspan fill="#E8C67E">by classification</tspan></text>
    <text x="590" y="650" fill="#5E6874" font-size="10.5">rank / title / certification —</text>
    <text x="590" y="666" fill="#5E6874" font-size="10.5">envelope, not distribution</text>
  </g>

  <!-- resolution gradient under the actors -->
  <line x1="72" y1="704" x2="802" y2="704" stroke="#3A434F" stroke-width="1"/>
  <text x="72" y="722" fill="#5E6874" font-size="10">◀ pinning resolution tightens</text>
  <text x="802" y="722" fill="#5E6874" font-size="10" text-anchor="end">pinning resolution loosens ▶</text>

  <!-- ================= THE FLOOR ================= -->
  <text x="852" y="560" fill="#6B7683" font-size="10.5" letter-spacing="2.4">THE POLANYI FLOOR</text>
  <text x="852" y="582" fill="#7C8794" font-size="11">What the judgment store rests on.</text>

  <!-- transfer floor -->
  <rect x="852" y="598" width="316" height="42" fill="#D9A441" opacity="0.13"/>
  <rect x="852" y="598" width="316" height="42" fill="none" stroke="#D9A441" stroke-width="1.2"/>
  <text x="868" y="617" fill="#E8C67E" font-size="12" font-weight="600">TRANSFER FLOOR</text>
  <text x="868" y="633" fill="#7E8B98" font-size="10.5">movable · manufactured by training · externalizes</text>

  <!-- intrinsic floor -->
  <rect x="852" y="640" width="316" height="42" fill="url(#bedrock)"/>
  <rect x="852" y="640" width="316" height="42" fill="none" stroke="#7C8794" stroke-width="1.2"/>
  <text x="868" y="659" fill="#B8C2CC" font-size="12" font-weight="600">INTRINSIC FLOOR</text>
  <text x="868" y="675" fill="#7E8B98" font-size="10.5">final · training cannot reach it</text>

  <!-- encoding pulls demand off the transfer floor, and only off the transfer floor -->
  <line x1="852" y1="619" x2="820" y2="619" stroke="#4C7FA8" stroke-width="1.4" marker-end="url(#arrowSteel)"/>
  <text x="1168" y="702" fill="#6E90A8" font-size="10.5" text-anchor="end">training lowers the transfer floor · encoding externalizes it</text>
  <text x="1168" y="717" fill="#5E6874" font-size="10.5" text-anchor="end">nothing reaches the intrinsic floor</text>

  <!-- zero-floor postulate -->
  <line x1="852" y1="732" x2="1168" y2="732" stroke="#242C36" stroke-width="1"/>
  <text x="852" y="754" fill="#8FC0DF" font-size="10.5" font-weight="600">ZERO-FLOOR POSTULATE</text>
  <text x="852" y="771" fill="#7E8B98" font-size="10.5">If the governing decisions and the acceptance predicate</text>
  <text x="852" y="786" fill="#7E8B98" font-size="10.5">both close over digital ground,</text>
  <text x="852" y="803" fill="#B8C2CC" font-size="10.5">the intrinsic floor is zero.</text>

  <!-- tier-specification inverse law, bottom-left -->
  <line x1="72" y1="746" x2="802" y2="746" stroke="#242C36" stroke-width="1"/>
  <text x="72" y="770" fill="#E8C67E" font-size="10.5" font-weight="600">TIER–SPECIFICATION INVERSE LAW</text>
  <text x="72" y="787" fill="#7E8B98" font-size="10.5">Withheld specification relocates demand onto the actor's floor. Tier rises precisely as encoded specification falls.</text>
  <text x="72" y="803" fill="#5E6874" font-size="10.5">Special operations: high tier because the ground will not hold encoding. Consulting: high tier because it wasn't encoded.</text>

</svg>
