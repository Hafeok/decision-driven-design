format: 1
id: DDD-agent-01
kind: empirical
statement: |
  Long-running agent drift is escaped decisions caused by basis loss: context decay, compaction, and distractors remove claim nodes from the agent's ground, so later actions are decisions with no basedOn edge to the declared claims and revert to model priors. Grounding the agent in a persistent external claim graph — basis as query, not context residue, with per-decision claim citation — reduces drift relative to context-carried instruction.
status: projected
region: >-
  long-running LLM agent sessions; product-core agent surface as the instrument
evidence:
- kind: derivation
  ref: measure-rag distractor rows (DDD-measure-05)
  note: >-
    the temporal analogue — I(V;context) decaying over turns pushes demand from encoded back
    to judgment; drift is the session-length version of channel degradation. Flagged — extension
    not yet computed.
falsifier: |
  Instrumented comparison shows basis coverage (fraction of actions citing valid claim refs) does not predict drift onset, or graph-grounded agents drift no less than context-carried baselines at matched capability.
breaks: |
  The runtime escaped-decision check as a drift remedy; the ontology's claim/decision split survives — it just would not explain this failure mode.
owner: none
changed: v4.5
notes: |
  UNVERIFIED — session-authored; Emil review. Stated in no core/ or meta/ document. The measure-rag evidence entry is a claimed temporal ANALOGUE, not a run — the seed itself marks it "extension not yet computed", so it is not confirmatory; measure-rag reproduces (verified, DDD-measure-05) but the drift extension does not exist yet. The claim is agent-drift theory applied to this repo's own agents (the basis-as-query framing this branch's CLAUDE.md section instantiates).
