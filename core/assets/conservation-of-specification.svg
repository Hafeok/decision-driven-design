<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="gap" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fafaf8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c97c1e" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="#fafaf8"/>

  <!-- Title -->
  <text x="60" y="52" font-size="22" fill="#333" font-weight="bold">The Conservation of Determination Demand</text>
  <text x="60" y="76" font-size="13" fill="#666">For a given task at a given assurance level the total is constant — only the allocation moves. The gap is what's missing.</text>
  <line x1="60" y1="96" x2="1140" y2="96" stroke="#ddd" stroke-width="1"/>

  <!-- Store labels -->
  <text x="80" y="150" font-size="11" fill="#999" letter-spacing="2">SPECIFICATION</text>
  <text x="80" y="168" font-size="11" fill="#666">encoded — paid once, amortized over runs</text>
  <text x="1120" y="150" font-size="11" fill="#999" letter-spacing="2" text-anchor="end">VERIFICATION</text>
  <text x="1120" y="168" font-size="11" fill="#666" text-anchor="end">mechanical — specification applied at the end</text>

  <!-- Judgment brackets over the gaps -->
  <text x="600" y="212" font-size="12" fill="#666" text-anchor="middle">judgment can cover either gap — the spec exists, unencoded, paid per run</text>
  <line x1="440" y1="236" x2="572" y2="236" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="440" y1="236" x2="440" y2="246" stroke="#999" stroke-width="1.5"/>
  <line x1="572" y1="236" x2="572" y2="246" stroke="#999" stroke-width="1.5"/>
  <line x1="628" y1="236" x2="760" y2="236" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="628" y1="236" x2="628" y2="246" stroke="#999" stroke-width="1.5"/>
  <line x1="760" y1="236" x2="760" y2="246" stroke="#999" stroke-width="1.5"/>

  <!-- Execution context baseline -->
  <line x1="80" y1="280" x2="1140" y2="280" stroke="#999" stroke-width="1"/>
  <polygon points="1140,280 1128,275 1128,285" fill="#999"/>
  <text x="80" y="322" font-size="11" fill="#999" letter-spacing="2">EXECUTION CONTEXT</text>
  <text x="74" y="264" font-size="11" fill="#666" text-anchor="end">Intent</text>
  <text x="1126" y="264" font-size="11" fill="#666">User</text>

  <!-- Specification bar and its gap -->
  <rect x="80" y="266" width="360" height="28" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="440" y="266" width="132" height="28" fill="url(#gap)" stroke="#c97c1e" stroke-width="1"/>

  <!-- Verification bar and its gap -->
  <rect x="628" y="266" width="132" height="28" fill="url(#gap)" stroke="#c97c1e" stroke-width="1"/>
  <rect x="760" y="266" width="360" height="28" fill="#ccc" stroke="#999" stroke-width="1"/>

  <!-- Model point -->
  <circle cx="600" cy="280" r="28" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="285" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">Model</text>
  <text x="600" y="326" font-size="11" fill="#666" text-anchor="middle">(pinned binding)</text>

  <!-- Escape flow -->
  <line x1="506" y1="344" x2="1128" y2="344" stroke="#c97c1e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="1140,344 1128,339 1128,349" fill="#c97c1e"/>
  <text x="1120" y="364" font-size="11" fill="#c97c1e" text-anchor="end">what neither store covers escapes — defect exposure</text>

  <!-- Gap annotations -->
  <line x1="506" y1="296" x2="420" y2="384" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="400" font-size="12" fill="#333">missing specification — the residual.</text>
  <text x="280" y="418" font-size="12" fill="#666">The model invents across this distance.</text>
  <line x1="694" y1="296" x2="740" y2="384" stroke="#ddd" stroke-width="1"/>
  <text x="700" y="400" font-size="12" fill="#333">missing verification.</text>
  <text x="700" y="418" font-size="12" fill="#666">Output crosses this on faith.</text>

  <!-- Divider -->
  <line x1="60" y1="470" x2="1140" y2="470" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="500" font-size="11" fill="#999" letter-spacing="2">ALLOCATIONS — THE TOTAL IS CONSTANT</text>

  <!-- Row 1: Explorer -->
  <text x="60" y="528" font-size="13" fill="#333">Explorer mode</text>
  <text x="60" y="546" font-size="11" fill="#666">no effectors — all judgment, per run. Legitimate.</text>
  <line x1="340" y1="530" x2="1120" y2="530" stroke="#ddd" stroke-width="1"/>
  <rect x="340" y="523" width="50" height="14" fill="#ccc" stroke="#999" stroke-width="1"/>
  <line x1="390" y1="512" x2="720" y2="512" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="555" y="506" font-size="10" fill="#666" text-anchor="middle">judgment (per run)</text>
  <rect x="1080" y="523" width="40" height="14" fill="#ccc" stroke="#999" stroke-width="1"/>
  <line x1="740" y1="512" x2="1080" y2="512" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="910" y="506" font-size="10" fill="#666" text-anchor="middle">judgment (per run)</text>
  <circle cx="730" cy="530" r="9" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Row 2: Under-engineered -->
  <text x="60" y="608" font-size="13" fill="#333">Under-engineered</text>
  <text x="60" y="626" font-size="11" fill="#666">gaps covered by no store — the difference ships.</text>
  <line x1="340" y1="610" x2="1120" y2="610" stroke="#ddd" stroke-width="1"/>
  <rect x="340" y="603" width="220" height="14" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="560" y="603" width="160" height="14" fill="url(#gap)" stroke="#c97c1e" stroke-width="1"/>
  <rect x="740" y="603" width="210" height="14" fill="url(#gap)" stroke="#c97c1e" stroke-width="1"/>
  <rect x="950" y="603" width="170" height="14" fill="#ccc" stroke="#999" stroke-width="1"/>
  <circle cx="730" cy="610" r="9" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Row 3: Complete -->
  <text x="60" y="688" font-size="13" fill="#333">complete(spec, binding)</text>
  <text x="60" y="706" font-size="11" fill="#666">fills meet the model; judgment share zero — Level 4+.</text>
  <line x1="340" y1="690" x2="1120" y2="690" stroke="#ddd" stroke-width="1"/>
  <rect x="340" y="683" width="380" height="14" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="740" y="683" width="380" height="14" fill="#ccc" stroke="#999" stroke-width="1"/>
  <circle cx="730" cy="690" r="9" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Footer -->
  <line x1="60" y1="724" x2="1140" y2="724" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="746" font-size="11" fill="#999">Encoded before the model, mechanical after it, judgment per run — and what none of them cover ships. Nothing is removed from the total; it is only moved.</text>
</svg>
